# Blueprint de Render para el SERVIDOR central (poller + API + correos).
# En Render: "New +" → "Blueprint" → conecta este repo. Render lee este archivo
# y te pedirá los 4 valores marcados (sync:false). Pégalos desde tu .env local.
services:
  - type: web
    name: polla-server
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm -r build
    startCommand: node apps/server/dist/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: FD_COMPETITION
        value: WC
      # --- Pega estos 4 en el panel (NO se versionan) ---
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FOOTBALL_DATA_TOKEN
        sync: false
      # Fuente ALTERNA de marcador en vivo (sportdb.dev). Sin ella, el poller
      # solo usa football-data (que en el plan gratis NO da el marcador en vivo).
      - key: SPORTDB_API_KEY
        sync: false
      # URL pública de la PWA (Vercel). Si aún no la tienes, pon un placeholder
      # y actualízala después (paso 3). Se usa en los enlaces de los correos.
      - key: SITE_URL
        sync: false
