name: keep-alive

# Mantiene despierto el servidor de Render (Free duerme tras 15 min sin uso).
# Al estar despierto, su poller consulta Supabase cada minuto, lo que además
# evita que el proyecto Supabase se pause por inactividad (7 días).
# Repo público ⇒ minutos de Actions gratis e ilimitados.
on:
  schedule:
    - cron: '*/5 * * * *' # cada ~5 min (GitHub lo ejecuta best-effort)
  workflow_dispatch: {} # permite dispararlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: curl -fsS --max-time 90 https://polla-server.onrender.com/api/health || true
